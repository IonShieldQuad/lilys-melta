[mod-description]
lilys-melta=Adds a short-ranged turret that burns liquid fuel into a pressurized stream of heat. It needs no ammunition.

[melta-tooltip]
block=Damage: __1__ per pulse on a cold barrel, __2__ when fully spun up (__3__ fire, __4__ physical).\nAt __5__ pulses per second that is __6__ to __7__ per second on the first enemy hit.\nEach enemy behind it takes __8__ of the hit before it, up to __9__ enemies.\nFuel bonus: __10__.\nRocks and asteroids also take an explosion hit at __11__ of the pulse damage.
block-no-rocks=Damage: __1__ per pulse on a cold barrel, __2__ when fully spun up (__3__ fire, __4__ physical).\nAt __5__ pulses per second that is __6__ to __7__ per second on the first enemy hit.\nEach enemy behind it takes __8__ of the hit before it, up to __9__ enemies.\nFuel bonus: __10__.
flat=Damage: __1__ per pulse on a cold barrel, __2__ when fully spun up (__3__ fire, __4__ physical).\nAt __5__ pulses per second that is __6__ to __7__ per second, on every enemy the beam crosses.\nFuel bonus: __8__.\nRocks and asteroids also take an explosion hit at __9__ of the pulse damage.
flat-no-rocks=Damage: __1__ per pulse on a cold barrel, __2__ when fully spun up (__3__ fire, __4__ physical).\nAt __5__ pulses per second that is __6__ to __7__ per second, on every enemy the beam crosses.\nFuel bonus: __8__.
armor=Ignores the flat part of enemy armor. Percentage resistance still applies.
research=Improved by fire damage research (once per researched level, including the infinite one) and by turret firing speed research, the same ladder the flamethrower turret uses.
