[entity-description]
melta-turret=Pipe it light oil, petroleum gas or [fluid=melta-fuel] and it holds a white-hot beam. Range 16 tiles at normal quality, further as quality goes up (24 at legendary). No falloff through a crowd, and it needs a couple of seconds of fire before it reaches full intensity. It burns what it hits: mostly fire damage, with a small physical component that still bites when a target shrugs the heat off.

