[technology-name]
melta-turret=Melta turret

[fluid-description]
melta-fuel=Pyrum laced with uranium dust. Burns green-white and noticeably hotter than plain oil.

[technology-description]
melta-turret=Thermal emitters that burn fuel instead of power. Short-ranged, slow to spin up, and nothing they hit survives for long.

[melta-tooltip]
block=Damage: __1__ per pulse on a cold barrel, __2__ at full intensity (__3__ fire, __4__ physical). At __5__ pulses per second that is __6__ to __7__ per second on the first body in the line; each body behind it takes __8__ of the one before, up to __9__ bodies. Fuel multiplies it: __10__. Rocks and asteroids also take an explosion hit at __11__ of the pulse.
