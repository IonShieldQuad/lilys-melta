[item-description]
melta-turret=Тепловой излучатель ближнего боя: 16 клеток, дальше с ростом качества (24 на легендарном). Один луч насквозь через всё, что стоит на линии.

[fluid-name]
melta-fuel=Обогащённое мельта-топливо

[entity-name]
melta-turret=Мельта-турель

[entity-description]
melta-turret=Подведите [fluid=melta-fuel] и она будет держать раскалённый луч. Дальность 16 клеток при обычном качестве, выше с ростом качества (24 на легендарном). Никакого затухания в толпе, и паре секунд огня нужно, чтобы выйти на полную мощность. Она жжёт то, во что попала: в основном огненный урон, плюс небольшая физическая составляющая — на случай, если цель не боится жара.

[recipe-name]
melta-turret=Мельта-турель
melta-fuel=Мельта-топливо

[technology-name]
melta-turret=Мельта-турель

[fluid-description]
melta-fuel=Пирум с примесью урановой пыли. Горит зелёно-белым и заметно горячее обычной нефти.

[technology-description]
melta-turret=Тепловые излучатели, которые жгут топливо вместо энергии. Малая дальность, долгий разогрев — и то, во что они попали, живёт недолго.

[melta-tooltip]
block=Урон: __1__ за импульс на холодном стволе, __2__ на полной мощности (__3__ огонь, __4__ физический). При __5__ импульсах в секунду это __6__–__7__ в секунду по первой цели на линии; каждая следующая цель получает __8__ от предыдущей, но не больше __9__ целей. Топливо умножает урон: __10__. По камням и астероидам проходит ещё и взрывной удар в __11__ от импульса.
