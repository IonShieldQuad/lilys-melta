[melta-tooltip]
block=Урон: __1__ за импульс на холодном стволе, __2__ на полной мощности (__3__ огонь, __4__ физический).\nПри __5__ импульсах в секунду это __6__–__7__ в секунду по первой цели.\nКаждая следующая цель получает __8__ от предыдущего попадания, но не больше __9__ целей.\nБонус топлива: __10__.\nПо камням и астероидам дополнительно проходит взрывной удар в __11__ от урона импульса.
block-no-rocks=Урон: __1__ за импульс на холодном стволе, __2__ на полной мощности (__3__ огонь, __4__ физический).\nПри __5__ импульсах в секунду это __6__–__7__ в секунду по первой цели.\nКаждая следующая цель получает __8__ от предыдущего попадания, но не больше __9__ целей.\nБонус топлива: __10__.
armor=Игнорирует плоскую часть брони цели. Процентное сопротивление действует полностью.
research=Усиливается исследованиями урона огнём (по одному разу за каждый уровень, включая бесконечный) и исследованиями скорости стрельбы турелей — та же линейка, что у огнемётной турели.
